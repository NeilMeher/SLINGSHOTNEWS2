name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allows manual trigger from GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.BACKEND_API_URL || 'http://localhost:5000/api' }}

      - name: Install Capacitor if not present
        working-directory: ./frontend
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Remove existing Android folder
        working-directory: ./frontend
        run: rm -rf android || true

      - name: Initialize Capacitor if needed
        working-directory: ./frontend
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "Slingshot News" "com.slingshotnews.app" --web-dir=dist
          fi

      - name: Add Android platform
        working-directory: ./frontend
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slingshot-news-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: slingshot-news-release
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Get APK info
        run: |
          echo "✅ APK Build Complete!"
          echo "📦 Debug APK: frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "📦 Release APK: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ls -la frontend/android/app/build/outputs/apk/debug/ || echo "Debug APK not found"
          ls -la frontend/android/app/build/outputs/apk/release/ || echo "Release APK not found"
